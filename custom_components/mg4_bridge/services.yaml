push:
  name: Push vehicle telemetry
  description: Arabadan gelen telemetri paketini cihaza yazar (REST states yerine).
  fields:
    prefix:
      name: Prefix
      description: Varlık öneki (birden fazla araç varsa)
      example: mg4
      selector:
        text:
    online:
      name: Online
      default: true
      selector:
        boolean:
    battery:
      name: Battery %
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
